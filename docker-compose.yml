version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/financial_health_db
      - DW_HOST=db
      - DW_DATABASE=financial_dw
      - DW_USER=postgres
      - DW_PASSWORD=postgres
      - FLASK_ENV=development
    depends_on:
      - db
    volumes:
      - .:/app
    command: python app.py

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=financial_health_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
